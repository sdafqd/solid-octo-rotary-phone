<style>
:root{
  --bg:#09090b;
  --panel:#111113;
  --panel-2:#0c0c0e;
  --line:#1f1f23;
  --line-2:#2a2a30;
  --fg:#fafafa;
  --muted:#a1a1aa;
  --faint:#8b8b94;
  --green:#22c55e;
  --green-soft:#4ade80;
  --sans:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono','SF Mono','JetBrains Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--fg);
  font-family:var(--sans);
  display:grid;place-items:center;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green-soft);outline-offset:3px}

.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg::before,.bg::after{content:'';position:absolute;border-radius:50%}
.bg::before{
  width:640px;height:640px;left:-160px;top:-200px;
  background:radial-gradient(circle,rgba(34,197,94,.13) 0%,transparent 68%);
  animation:drift1 9s ease-in-out infinite alternate;
}
.bg::after{
  width:520px;height:520px;right:-120px;bottom:-140px;
  background:radial-gradient(circle,rgba(124,58,237,.11) 0%,transparent 68%);
  animation:drift2 11s ease-in-out infinite alternate;
}
@keyframes drift1{to{transform:translate(40px,30px) scale(1.1)}}
@keyframes drift2{to{transform:translate(-30px,-20px) scale(1.15)}}
.grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 100%);
          mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 100%);
}

.shell{width:100%;max-width:420px;position:relative;z-index:1}
.panel{
  background:linear-gradient(180deg,#141416,var(--panel) 40%);
  border:1px solid var(--line);
  border-radius:22px;
  padding:clamp(24px,5vw,32px);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 80px -20px rgba(0,0,0,.8);
  display:grid;gap:22px;
}
.brand{display:grid;gap:10px}
.brand-name{
  font-size:clamp(2.6rem,12vw,3.6rem);font-weight:700;
  letter-spacing:-.045em;line-height:.95;
  background:linear-gradient(180deg,#fff 30%,#a1a1aa);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{font-size:.92rem;color:var(--muted);line-height:1.5;max-width:34ch}
[hidden]{display:none!important}

.progress{display:grid;gap:10px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem}
.progress-row span:first-child{color:var(--muted);font-weight:500}
.progress-row span:last-child{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.ptrack{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar{height:100%;width:0;background:linear-gradient(90deg,#16a34a,var(--green-soft));border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}

.tasks{list-style:none;display:grid;gap:10px}
.task{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  padding:14px 16px;min-height:60px;
  border-radius:14px;border:1px solid rgba(255,255,255,.08);
  font-size:.95rem;font-weight:500;color:#fff;
  cursor:pointer;touch-action:manipulation;
  position:relative;overflow:hidden;isolation:isolate;
  transition:transform .12s ease,filter .2s ease,opacity .2s ease,background-color .2s ease;
}
.task:hover:not(:disabled){filter:brightness(1.08)}
.task:active:not(:disabled){transform:scale(.985)}
.task:disabled{cursor:default}
.task.youtube{background:linear-gradient(135deg,#b3000f,#e11d2a)}
.task.discord{background:linear-gradient(135deg,#3730a3,#5865f2)}
.task.other{background:linear-gradient(135deg,#27272a,#3f3f46)}
.ti{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(0,0,0,.22);display:grid;place-items:center}
.ti svg{width:18px;height:18px;fill:#fff}
.tx{flex:1;min-width:0;line-height:1.3}
.tx small{display:block;font-size:.76rem;font-weight:400;opacity:.8;margin-top:2px}
.arr,.ck{width:18px;height:18px;flex:none}
.arr{opacity:.55;transition:transform .15s ease,opacity .15s ease}
.task:hover:not(:disabled) .arr{opacity:.9;transform:translateX(3px)}
.ck{display:none}

.task.off{opacity:.35}
.task.busy .arr{display:none}
.task.busy::after{
  content:'';position:absolute;left:0;bottom:0;height:3px;width:100%;
  background:rgba(255,255,255,.85);transform-origin:left;
  animation:fill var(--dur,10s) linear forwards;animation-delay:var(--delay,0s);
}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.spin{display:none;width:18px;height:18px;flex:none;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
.task.busy .spin{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.task.done{background:var(--panel-2);border-color:var(--line);color:var(--muted)}
.task.done .ti{background:var(--line)}
.task.done .ti svg{fill:var(--faint)}
.task.done .arr{display:none}
.task.done .ck{display:block;stroke:var(--green-soft)}

.sbox{display:grid;gap:14px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.unlocked{display:flex;align-items:center;gap:12px}
.badge{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
.badge svg{width:20px;height:20px;stroke:var(--green-soft)}
.unlocked h2{font-size:1.05rem;font-weight:600;letter-spacing:-.01em}
pre{
  background:var(--bg);color:#d4d4d8;
  padding:14px 16px;border-radius:12px;border:1px solid var(--line);
  font-family:var(--mono);font-size:.78rem;line-height:1.7;
  white-space:pre-wrap;word-break:break-all;
  max-height:40vh;overflow:auto;
  user-select:all;-webkit-user-select:all;cursor:text;
}
.cpbtn{
  width:100%;min-height:48px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--fg);color:var(--bg);
  border:1px solid var(--fg);border-radius:12px;
  font-weight:600;font-size:.9rem;cursor:pointer;touch-action:manipulation;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease,transform .1s ease;
}
.cpbtn:hover{background:#e4e4e7}
.cpbtn:active{transform:scale(.985)}
.cpbtn svg{width:15px;height:15px}
.cpbtn.ok{background:#14532d;border-color:#16a34a;color:var(--green-soft)}
.cpbtn.fail{background:var(--panel-2);border-color:var(--line-2);color:var(--fg)}

.state{padding:22px 0;text-align:center;font-size:.85rem;color:var(--muted)}
.state.loading{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

.foot{text-align:center;font-size:.78rem;color:var(--faint);font-weight:500;letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .task.busy::after{animation:none;transform:scaleX(1);opacity:.4}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="grid" aria-hidden="true"></div>

<main class="shell">
  <div class="panel">
    <header class="brand">
      <h1 class="brand-name">G Scripts</h1>
      <p class="sub" id="sub">Finish the task below to get your script.</p>
    </header>

    <div id="tc" aria-live="polite"></div>

    <section class="sbox" id="sb" hidden aria-labelledby="sbTitle">
      <div class="unlocked">
        <div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
        <h2 id="sbTitle">Script unlocked</h2>
      </div>
      <pre id="sc" tabindex="0" aria-label="Script"></pre>
      <button class="cpbtn" id="cb" type="button"></button>
    </section>

    <footer class="foot">gscripts.xyz</footer>
  </div>
</main>
